name: Snapshot Contributor Reputation

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:



permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch linkclean bot actions
        uses: actions/checkout@v6
        with:
          repository: linkclean/linkclean
          token: ${{ secrets.LINKCLEAN_PAT }}
          ref: ${{ vars.LINKCLEAN_REF }}
          path: _linkclean
          sparse-checkout: |
            .github/actions
            scripts
            src/core
          sparse-checkout-cone-mode: true

      - uses: ./_linkclean/.github/actions/compute-reputation
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-repository: ${{ github.repository }}
          reputation-file: ${{ github.workspace }}/data/reputation.json

      - name: Commit if changed
        run: |
          git config user.name "linkclean-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/reputation.json
          git diff --cached --quiet || git commit -m "chore: snapshot contributor reputation"
          git push
