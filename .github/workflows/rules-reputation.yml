name: Snapshot Contributor Reputation

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check-runner:
    name: Resolve runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check runner availability
        id: check
        uses: pinnacledigital/github-runner/.github/actions/runner-check@master
        with:
          labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
          token: ${{ secrets.RUNNER_API_TOKEN || github.token }}

  snapshot:
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch linkclean bot actions
        uses: actions/checkout@v4
        with:
          repository: linkclean/linkclean
          token: ${{ secrets.LINKCLEAN_PAT }}
          ref: ${{ vars.LINKCLEAN_REF }}
          path: _linkclean
          sparse-checkout: |
            .github/actions
            scripts
            src/core
          sparse-checkout-cone-mode: true

      - uses: ./_linkclean/.github/actions/compute-reputation
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-repository: ${{ github.repository }}
          reputation-file: ${{ github.workspace }}/data/reputation.json

      - name: Commit if changed
        run: |
          git config user.name "linkclean-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/reputation.json
          git diff --cached --quiet || git commit -m "chore: snapshot contributor reputation"
          git push
