name: Tally Rule-suggestion Votes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: write

jobs:
  check-runner:
    name: Resolve runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check runner availability
        id: check
        uses: pinnacledigital/github-runner/.github/actions/runner-check@master
        with:
          labels: ${{ vars.RUNNER_LABELS || '["ubuntu-latest"]' }}
          token: ${{ secrets.RUNNER_API_TOKEN || github.token }}

  tally:
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch linkclean bot actions
        uses: actions/checkout@v4
        with:
          repository: linkclean/linkclean
          token: ${{ secrets.LINKCLEAN_PAT }}
          ref: ${{ vars.LINKCLEAN_REF }}
          path: _linkclean
          sparse-checkout: |
            .github/actions
            scripts
            src/core
          sparse-checkout-cone-mode: true

      - uses: ./_linkclean/.github/actions/tally-votes
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gh-repository: ${{ github.repository }}
          promote-threshold: '5'
